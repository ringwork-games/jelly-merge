<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jelly Merge</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0820;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><script>const SAVE_KEY="jelly-merge-v1";
// Shared core: canvas fit, audio, save, particles, shake, optional CrazyGames SDK
const C=document.getElementById('c'),X=C.getContext('2d');let W=0,H=0,DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;C.width=W*DPR;C.height=H*DPR;C.style.width=W+'px';C.style.height=H+'px';X.setTransform(DPR,0,0,DPR,0,0);if(window.onFit)onFit();}
addEventListener('resize',fit);
const Save={k:SAVE_KEY,get(){try{return JSON.parse(localStorage.getItem(this.k))||{}}catch(e){return{}}},set(o){try{localStorage.setItem(this.k,JSON.stringify(o))}catch(e){}}};
let AC=null,muted=!!Save.get().muted;
function au(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d=.1,type='sine',v=.15,slide=0,delay=0){if(muted||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function noise(d=.15,v=.2){if(muted||!AC)return;const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=v;s.buffer=b;s.connect(g);g.connect(AC.destination);s.start();}
let parts=[],shakeT=0,shakeM=0,floats=[];
function burst(x,y,col,n=14,sp=4,life=40,sz=3){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life*(.5+Math.random()*.5),m:life,c:col,s:sz*(.5+Math.random())});}}
function floatText(x,y,t,c='#fff',s=22){floats.push({x,y,t,c,s,l:60});}
function shake(m,t=12){shakeM=Math.max(shakeM,m);shakeT=Math.max(shakeT,t);}
function stepFx(g=0){for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=g;p.vx*=.97;p.vy*=.97;p.l--;}parts=parts.filter(p=>p.l>0);for(const f of floats){f.y-=.8;f.l--;}floats=floats.filter(f=>f.l>0);if(shakeT>0)shakeT--;else shakeM=0;}
function drawFx(){for(const p of parts){X.globalAlpha=Math.max(0,p.l/p.m);X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.s,0,6.283);X.fill();}X.globalAlpha=1;X.textAlign='center';for(const f of floats){X.globalAlpha=Math.min(1,f.l/30);X.font=`900 ${f.s}px system-ui,sans-serif`;X.fillStyle=f.c;X.fillText(f.t,f.x,f.y);}X.globalAlpha=1;}
function shakeOff(){return shakeT>0?[(Math.random()-.5)*shakeM*2,(Math.random()-.5)*shakeM*2]:[0,0];}
const SDK={s(){try{return window.CrazyGames&&CrazyGames.SDK&&CrazyGames.SDK.environment!=='disabled'?CrazyGames.SDK:null}catch(e){return null}},start(){try{const s=this.s();s&&s.game.gameplayStart()}catch(e){}},stop(){try{const s=this.s();s&&s.game.gameplayStop()}catch(e){}},happy(){try{const s=this.s();s&&s.game.happytime()}catch(e){}}};
try{window.CrazyGames&&CrazyGames.SDK&&CrazyGames.SDK.init&&CrazyGames.SDK.init().catch(()=>{})}catch(e){}
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
function btn(x,y,w,h,label,col='#ffd23f',tc='#1a1030'){rr(x-w/2,y-h/2,w,h,h/2);X.fillStyle=col;X.fill();X.fillStyle=tc;X.font=`900 ${h*.42}px system-ui,sans-serif`;X.textAlign='center';X.textBaseline='middle';X.fillText(label,x,y+1);X.textBaseline='alphabetic';return {x:x-w/2,y:y-h/2,w,h};}
function inR(p,r){return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
function muteBtn(){const r={x:W-52,y:10,w:42,h:42};rr(r.x,r.y,r.w,r.h,12);X.fillStyle='rgba(255,255,255,.15)';X.fill();X.fillStyle='#fff';X.font='22px sans-serif';X.textAlign='center';X.fillText(muted?'🔇':'🔊',r.x+21,r.y+29);return r;}
function toggleMute(){muted=!muted;const s=Save.get();s.muted=muted;Save.set(s);}

// JELLY MERGE — drop & merge physics puzzle
const BW=100,BH=150,LINE=24,TR=[4.6,6,7.6,9.4,11.6,14,16.8,20,23.6,27.6,32];
const TC=['#ff5e7e','#ff9f43','#feca57','#7bed9f','#2ed573','#48dbfb','#1e90ff','#a29bfe','#f368e0','#ff4757','#ffd32a'];
let S=1,OX=0,OY=0;function onFit(){S=Math.min(W*.94/BW,(H-130)/BH);OX=(W-BW*S)/2;OY=H-BH*S-16;}
const sx=x=>OX+x*S,sy=y=>OY+y*S;
let save=Object.assign({best:0,top:0},Save.get());
let state='title',balls=[],aimX=50,cur=0,nxt=0,cool=0,score=0,maxT=0,dangerT=0,tick=0,ui={},combo=0,comboT=0,newBest=false,overT=0,keys={},shownScore=0;
function spawnTier(){const m=Math.min(4,Math.max(2,maxT-1));return Math.min(m,Math.floor(Math.pow(Math.random(),1.4)*(m+1)));}
function newGame(){balls=[];score=0;shownScore=0;maxT=0;dangerT=0;combo=0;newBest=false;cur=0;nxt=spawnTier();cool=10;aimX=50;state='play';SDK.start();}
function addBall(t,x,y,age=0){const b={t,r:TR[t],x,y,px:x,py:y,age,pop:age?1:0,blink:Math.random()*300,dead:false};balls.push(b);return b;}
function drop(){if(state!=='play'||cool>0)return;const r=TR[cur],x=Math.max(r+.3,Math.min(BW-r-.3,aimX));addBall(cur,x,LINE-r-4);cur=nxt;nxt=spawnTier();cool=26;tone(300+cur*30,.08,'triangle',.1,120);}
function merge(a,b){a.dead=b.dead=true;const t=a.t+1,x=(a.x+b.x)/2,y=(a.y+b.y)/2;comboT=50;combo++;const mult=Math.min(5,combo);
 if(a.t===TR.length-1){score+=1000*mult;burst(sx(x),sy(y),'#fff',50,9,70,5);burst(sx(x),sy(y),TC[a.t],40,7,60,4);floatText(sx(x),sy(y),'MEGA! +'+1000*mult,'#ffd32a',36);shake(14,24);tone(523,.4,'triangle',.18);tone(784,.5,'triangle',.15,0,.12);SDK.happy();return;}
 const n=addBall(t,x,y,61);n.px=x;n.py=y+.2;const pts=(t+1)*(t+2)/2*mult;score+=pts;if(t>maxT){maxT=t;if(t>=5){floatText(W/2,OY-10,'NEW JELLY!','#7bed9f',28);}if(t>save.top){save.top=t;}}
 burst(sx(x),sy(y),TC[t],10+t*3,2+t*.5,40,2+t*.4);floatText(sx(x),sy(y)-n.r*S,(mult>1?'x'+mult+' ':'')+'+'+pts,mult>1?'#ffd32a':'#fff',16+t*2);
 tone(260*Math.pow(1.122,t+Math.min(combo,6)),.16,'sine',.16,80);tone(130*Math.pow(1.122,t),.12,'triangle',.08);if(t>=4)shake(1+t*.6,6+t);if(t>=7)SDK.happy();}
function phys(){const SUB=6,g=.12/(SUB*SUB);const pairs=[];
 for(let s=0;s<SUB;s++){for(const b of balls){if(b.dead)continue;const vx=(b.x-b.px)*.997,vy=(b.y-b.py)*.997;b.px=b.x;b.py=b.y;b.x+=vx;b.y+=vy+g;}
  for(let it=0;it<2;it++){for(let i=0;i<balls.length;i++){const a=balls[i];if(a.dead)continue;for(let j=i+1;j<balls.length;j++){const b=balls[j];if(b.dead)continue;const dx=b.x-a.x,dy=b.y-a.y,rs=a.r+b.r,d2=dx*dx+dy*dy;if(d2>=rs*rs)continue;
   if(a.t===b.t&&a.age>4&&b.age>4){merge(a,b);break;}const d=Math.sqrt(d2)||.001,ov=(rs-d)*.8,nx=dx/d,ny=dy/d,ma=a.r*a.r,mb=b.r*b.r,ka=mb/(ma+mb),kb=1-ka;a.x-=nx*ov*ka;a.y-=ny*ov*ka;b.x+=nx*ov*kb;b.y+=ny*ov*kb;}}
   for(const b of balls){if(b.dead)continue;if(b.x<b.r){b.x=b.r;b.px=b.x+(b.x-b.px)*-.3}if(b.x>BW-b.r){b.x=BW-b.r;b.px=b.x+(b.x-b.px)*-.3}if(b.y>BH-b.r){b.y=BH-b.r;b.px=b.x-(b.x-b.px)*.85;}}}
  balls=balls.filter(b=>!b.dead);}
 for(const b of balls){b.age++;b.pop*=.85;}}
function over(){state='over';overT=0;shake(10,20);tone(200,.5,'sawtooth',.12,-120);SDK.stop();if(score>save.best){save.best=score;newBest=true;}Save.set(Object.assign(Save.get(),save));}
function jelly(b,x,y,r,t){const c=TC[t];const sp=Math.min(.18,Math.hypot(b?b.x-b.px:0,b?b.y-b.py:0)*.25),pr=r*(1+(b?b.pop*.25:0));
 X.save();X.translate(x,y);X.scale(1+sp*.5,1-sp*.4);const g=X.createRadialGradient(-pr*.35,-pr*.4,pr*.1,0,0,pr);g.addColorStop(0,'#fff');g.addColorStop(.18,c);g.addColorStop(1,shade(c,-.35));X.fillStyle=g;X.beginPath();X.arc(0,0,pr,0,6.283);X.fill();
 X.lineWidth=Math.max(1.5,pr*.06);X.strokeStyle=shade(c,-.5);X.stroke();X.fillStyle='rgba(255,255,255,.55)';X.beginPath();X.ellipse(-pr*.38,-pr*.45,pr*.22,pr*.12,-.6,0,6.283);X.fill();
 const bl=b&&((tick+b.blink)%260<8),e=pr*.16,ey=-pr*.05,lx=b?Math.max(-1,Math.min(1,(b.x-b.px)*3)):0;
 for(const s of[-1,1]){X.fillStyle='#fff';if(bl){X.fillRect(s*pr*.3-e,ey,e*2,e*.4);continue;}X.beginPath();X.arc(s*pr*.3,ey,e,0,6.283);X.fill();X.fillStyle='#1a1030';X.beginPath();X.arc(s*pr*.3+lx*e*.4,ey+e*.2,e*.55,0,6.283);X.fill();}
 X.strokeStyle='#1a1030';X.lineWidth=Math.max(1.2,pr*.05);X.beginPath();X.arc(0,pr*.18,pr*.16,.2,Math.PI-.2);X.stroke();X.fillStyle='rgba(255,120,150,.45)';for(const s of[-1,1]){X.beginPath();X.ellipse(s*pr*.52,pr*.16,pr*.12,pr*.07,0,0,6.283);X.fill();}X.restore();}
function shade(h,k){const n=parseInt(h.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.round(k<0?v*(1+k):v+(255-v)*k);return`rgb(${f(r)},${f(g)},${f(b)})`;}
function txt(t,x,y,s,c='#fff',a='center'){X.font=`900 ${s}px system-ui,sans-serif`;X.textAlign=a;X.lineWidth=s*.14;X.strokeStyle='rgba(20,8,40,.7)';X.lineJoin='round';X.strokeText(t,x,y);X.fillStyle=c;X.fillText(t,x,y);}
function bg(){const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2b1055');g.addColorStop(1,'#7597de');X.fillStyle=g;X.fillRect(0,0,W,H);X.fillStyle='rgba(255,255,255,.07)';for(let i=0;i<14;i++){const r=20+(i*37)%70,x=(i*173+tick*.15*(1+i%3))%(W+200)-100,y=(i*97)%H;X.beginPath();X.arc(x,(y-tick*.2*(1+i%2)+H*5)%(H+200)-100,r,0,6.283);X.fill();}}
function box(){rr(OX-8,OY-8,BW*S+16,BH*S+16,18);X.fillStyle='rgba(255,255,255,.12)';X.fill();X.lineWidth=4;X.strokeStyle='rgba(255,255,255,.55)';X.stroke();rr(OX,OY,BW*S,BH*S,12);X.fillStyle='rgba(20,10,50,.35)';X.fill();
 const dg=dangerT>0;X.setLineDash([10,8]);X.lineWidth=3;X.strokeStyle=dg?`rgba(255,70,90,${.5+.5*Math.sin(tick*.4)})`:'rgba(255,255,255,.3)';X.beginPath();X.moveTo(OX,sy(LINE));X.lineTo(OX+BW*S,sy(LINE));X.stroke();X.setLineDash([]);}
function frame(){tick++;ui={};bg();const[ox,oy]=shakeOff();X.save();X.translate(ox,oy);box();
 if(state==='play'){if(keys.l)aimX-=1.3;if(keys.r)aimX+=1.3;aimX=Math.max(0,Math.min(BW,aimX));if(cool>0)cool--;if(comboT>0&&--comboT===0)combo=0;phys();
  let dz=false;for(const b of balls)if(b.age>70&&b.y-b.r<LINE)dz=true;dangerT=dz?dangerT+1:Math.max(0,dangerT-3);if(dangerT>150)over();
  const r=TR[cur],ax=Math.max(r,Math.min(BW-r,aimX));X.strokeStyle='rgba(255,255,255,.25)';X.setLineDash([4,6]);X.lineWidth=2;X.beginPath();X.moveTo(sx(ax),sy(LINE-r-4));X.lineTo(sx(ax),sy(BH));X.stroke();X.setLineDash([]);
  X.globalAlpha=cool>0?.4:1;jelly(null,sx(ax),sy(LINE-r-4)+Math.sin(tick*.1)*2,r*S,cur);X.globalAlpha=1;}
 if(state==='over'){overT++;if(overT%5===0&&balls.length){const b=balls.splice(Math.floor(Math.random()*balls.length),1)[0];burst(sx(b.x),sy(b.y),TC[b.t],12,4,40,3);tone(300+b.t*40,.06,'sine',.06);}}
 for(const b of balls)jelly(b,sx(b.x),sy(b.y),b.r*S,b.t);
 stepFx(.12);drawFx();X.restore();
 if(state==='title'){if(!balls.length)for(let i=0;i<7;i++)addBall(i,12+i*12,BH-TR[i]-Math.random()*40);if(tick%2===0)phys();const m=Math.min(W,H*.7);txt('JELLY',W/2,H*.2,m*.17,'#ff9ff3');txt('MERGE',W/2,H*.2+m*.15,m*.15,'#feca57');
  ui.play=btn(W/2,H*.62,Math.min(300,W*.7),64,'TAP TO PLAY');txt('BEST  '+save.best,W/2,H*.62+62,22);}
 else{shownScore+=(score-shownScore)*.2;const fs=Math.min(48,W*.1);txt(Math.round(shownScore),W/2,Math.min(OY-40,fs+10),fs);txt('BEST '+Math.max(save.best,score),W/2,Math.min(OY-14,fs+34),16,'#ffe');
  const nxR=Math.min(34,TR[nxt]*S*.6+6),nx=OX+BW*S-nxR-4,ny=Math.max(nxR+8,OY-nxR-18);if(state==='play'){txt('NEXT',nx-nxR-14,ny+6,14,'#fff','right');jelly(null,nx,ny,nxR,nxt);}
  if(combo>1&&comboT>0)txt('COMBO x'+Math.min(5,combo),W/2,OY+40,26,'#ffd32a');
  if(state==='play'&&balls.length<3)txt('Aim, then tap to drop. Match jellies to merge!',W/2,OY+BH*S*.5,Math.min(20,W*.045));
  if(dangerT>30&&state==='play')txt('DANGER!',W/2,sy(LINE)+30,28,'#ff4757');
  if(state==='over'&&overT>50){X.fillStyle='rgba(0,0,0,.5)';X.fillRect(0,0,W,H);const m=Math.min(W,H*.7);txt(newBest?'★ NEW BEST ★':'JAR FULL!',W/2,H*.3,m*.09,newBest?'#ffd32a':'#fff');txt(score,W/2,H*.3+m*.18,m*.16);txt('Best '+save.best,W/2,H*.3+m*.26,m*.05,'#ddd');ui.play=btn(W/2,H*.72,Math.min(300,W*.7),64,'PLAY AGAIN');}}
 ui.mute=muteBtn();requestAnimationFrame(frame);}
function toAim(p){aimX=(p.x-OX)/S;}
C.addEventListener('pointermove',e=>{if(state==='play')toAim({x:e.clientX});});
C.addEventListener('pointerdown',e=>{au();const p={x:e.clientX,y:e.clientY};if(inR(p,ui.mute)){toggleMute();return;}if(state==='title'){balls=[];newGame();tone(520,.1,'triangle',.12,300);return;}if(state==='over'){if(overT>50&&inR(p,ui.play)){balls=[];newGame();}return;}toAim(p);C._armed=true;});
C.addEventListener('pointerup',e=>{if(state==='play'&&C._armed){toAim({x:e.clientX});drop();}C._armed=false;});
addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=1;if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=1;if(e.repeat)return;if(e.code==='KeyM')toggleMute();if(e.code==='Space'||e.code==='Enter'){e.preventDefault();au();if(state==='title'){balls=[];newGame();}else if(state==='over'){if(overT>50){balls=[];newGame();}}else drop();}});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=0;if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=0;});
fit();frame();

</script></body></html>
